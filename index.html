<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vekipedia - 偏見的地元民百科事典</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 font-sans">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center">
                    <h1 class="text-2xl font-bold text-blue-600">
                        <i class="fas fa-book-open mr-2"></i>
                        Vekipedia
                    </h1>
                    <span class="ml-3 text-sm text-gray-500 hidden sm:block">偏見的地元民百科事典</span>
                </div>
                <nav class="flex items-center space-x-4">
                    <button onclick="showAddArticleModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                        <i class="fas fa-plus mr-2"></i>記事を追加
                    </button>
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="記事を検索..." class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Hero Section -->
        <div class="bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-lg p-8 mb-8">
            <h2 class="text-3xl font-bold mb-4">ようこそ、Vekipediaへ！</h2>
            <p class="text-lg mb-6">日本全国47都道府県の「地元民しか分からない」偏見的あるあるネタを集めた百科事典です。</p>
            <div class="flex flex-col sm:flex-row gap-4">
                <div class="bg-white/10 backdrop-blur-sm rounded-lg p-4 flex-1">
                    <div class="text-2xl font-bold" id="totalArticles">0</div>
                    <div class="text-sm opacity-75">総記事数</div>
                </div>
                <div class="bg-white/10 backdrop-blur-sm rounded-lg p-4 flex-1">
                    <div class="text-2xl font-bold" id="totalPrefectures">0</div>
                    <div class="text-sm opacity-75">対応都道府県</div>
                </div>
                <div class="bg-white/10 backdrop-blur-sm rounded-lg p-4 flex-1">
                    <div class="text-2xl font-bold" id="totalContributors">∞</div>
                    <div class="text-sm opacity-75">地元民投稿者</div>
                </div>
            </div>
        </div>

        <!-- Prefecture Navigation -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-8">
            <h3 class="text-xl font-bold text-gray-900 mb-4">
                <i class="fas fa-map-marked-alt mr-2"></i>都道府県から探す
            </h3>
            <div class="grid grid-cols-3 sm:grid-cols-6 lg:grid-cols-8 gap-3" id="prefectureGrid">
                <!-- 都道府県ボタンがJavaScriptで生成される -->
            </div>
        </div>

        <!-- Category Navigation -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-8">
            <h3 class="text-xl font-bold text-gray-900 mb-4">
                <i class="fas fa-tags mr-2"></i>カテゴリから探す
            </h3>
            <div class="flex flex-wrap gap-3" id="categoryButtons">
                <!-- カテゴリボタンがJavaScriptで生成される -->
            </div>
        </div>

        <!-- Articles Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Latest Articles -->
            <div class="lg:col-span-2">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold text-gray-900">
                        <i class="fas fa-clock mr-2"></i>
                        <span id="articlesTitle">最新の記事</span>
                    </h3>
                    <button onclick="clearFilters()" class="text-blue-600 hover:text-blue-800 text-sm" id="clearFiltersBtn" style="display: none;">
                        フィルターをクリア
                    </button>
                </div>
                <div class="space-y-4" id="articlesList">
                    <!-- 記事がJavaScriptで動的に表示される -->
                </div>
                <div id="noArticlesMessage" class="text-center py-12 text-gray-500" style="display: none;">
                    <i class="fas fa-search text-4xl mb-4 opacity-50"></i>
                    <p>該当する記事が見つかりませんでした。</p>
                    <button onclick="showAddArticleModal()" class="mt-4 text-blue-600 hover:text-blue-800">
                        最初の記事を投稿しませんか？
                    </button>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="lg:col-span-1">
                <!-- Popular Articles -->
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-6">
                    <h4 class="font-bold text-gray-900 mb-4">
                        <i class="fas fa-fire mr-2 text-orange-500"></i>人気の記事
                    </h4>
                    <div id="popularArticles" class="space-y-3">
                        <!-- 人気記事がJavaScriptで表示される -->
                    </div>
                </div>

                <!-- Recent Updates -->
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                    <h4 class="font-bold text-gray-900 mb-4">
                        <i class="fas fa-history mr-2 text-green-500"></i>最近の更新
                    </h4>
                    <div id="recentUpdates" class="space-y-3">
                        <!-- 最近の更新がJavaScriptで表示される -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Add Article Modal -->
    <div id="addArticleModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" style="display: none;">
        <div class="bg-white rounded-lg p-6 w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-gray-900">新しい記事を投稿</h3>
                <button onclick="hideAddArticleModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <form id="addArticleForm" class="space-y-4">
                <div>
                    <label for="articleTitle" class="block text-sm font-medium text-gray-700 mb-2">記事タイトル *</label>
                    <input type="text" id="articleTitle" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="例: イオンモール熊本">
                </div>
                <div>
                    <label for="articlePrefecture" class="block text-sm font-medium text-gray-700 mb-2">都道府県 *</label>
                    <select id="articlePrefecture" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">都道府県を選択</option>
                        <!-- 都道府県オプションがJavaScriptで生成される -->
                    </select>
                </div>
                <div>
                    <label for="articleCategory" class="block text-sm font-medium text-gray-700 mb-2">カテゴリ *</label>
                    <select id="articleCategory" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">カテゴリを選択</option>
                        <!-- カテゴリオプションがJavaScriptで生成される -->
                    </select>
                </div>
                <div>
                    <label for="articleContent" class="block text-sm font-medium text-gray-700 mb-2">記事内容 *</label>
                    <textarea id="articleContent" required rows="8" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="偏見的で愛情のこもった地元あるあるを書いてください..."></textarea>
                </div>
                <div>
                    <label for="articleAuthor" class="block text-sm font-medium text-gray-700 mb-2">投稿者名（任意）</label>
                    <input type="text" id="articleAuthor" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="匿名">
                </div>
                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" onclick="hideAddArticleModal()" class="px-4 py-2 text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50">
                        キャンセル
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        投稿する
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Article Detail Modal -->
    <div id="articleModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" style="display: none;">
        <div class="bg-white rounded-lg p-6 w-full max-w-3xl mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-start mb-4">
                <div class="flex-1">
                    <h3 id="modalTitle" class="text-2xl font-bold text-gray-900 mb-2"></h3>
                    <div id="modalMeta" class="flex items-center text-sm text-gray-500 space-x-4"></div>
                </div>
                <button onclick="hideArticleModal()" class="text-gray-400 hover:text-gray-600 ml-4">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div id="modalContent" class="prose max-w-none mb-6"></div>
            <div class="flex justify-between items-center pt-4 border-t border-gray-200">
                <div class="flex space-x-2">
                    <button onclick="likeArticle()" class="flex items-center space-x-1 text-gray-500 hover:text-red-500">
                        <i class="far fa-heart" id="likeIcon"></i>
                        <span id="likeCount">0</span>
                    </button>
                    <button onclick="editArticle()" class="flex items-center space-x-1 text-gray-500 hover:text-blue-500">
                        <i class="fas fa-edit"></i>
                        <span>編集</span>
                    </button>
                </div>
                <div id="modalAuthor" class="text-sm text-gray-500"></div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
