<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vekipedia - 管理者ページ</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 font-sans">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center">
                    <a href="index.html" class="text-2xl font-bold text-blue-600">
                        <i class="fas fa-book-open mr-2"></i>
                        Vekipedia
                    </a>
                    <span class="ml-3 text-sm text-gray-500">管理者ページ</span>
                </div>
                <nav class="flex items-center space-x-4">
                    <a href="index.html" class="text-gray-600 hover:text-gray-900">
                        <i class="fas fa-home mr-1"></i>メインページ
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <i class="fas fa-newspaper text-2xl text-blue-500"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-500">総記事数</p>
                        <p class="text-2xl font-semibold text-gray-900" id="totalArticlesAdmin">0</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <i class="fas fa-map-marked-alt text-2xl text-green-500"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-500">対応都道府県</p>
                        <p class="text-2xl font-semibold text-gray-900" id="activePrefectures">0</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <i class="fas fa-heart text-2xl text-red-500"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-500">総いいね数</p>
                        <p class="text-2xl font-semibold text-gray-900" id="totalLikes">0</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <i class="fas fa-eye text-2xl text-purple-500"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-sm font-medium text-gray-500">総閲覧数</p>
                        <p class="text-2xl font-semibold text-gray-900" id="totalViews">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Management Tabs -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200">
            <div class="border-b border-gray-200">
                <nav class="flex space-x-8" aria-label="Tabs">
                    <button onclick="switchTab('articles')" class="admin-tab active py-4 px-6 text-sm font-medium border-b-2 border-blue-500 text-blue-600">
                        記事管理
                    </button>
                    <button onclick="switchTab('prefectures')" class="admin-tab py-4 px-6 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700">
                        都道府県管理
                    </button>
                    <button onclick="switchTab('categories')" class="admin-tab py-4 px-6 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700">
                        カテゴリ管理
                    </button>
                    <button onclick="switchTab('analytics')" class="admin-tab py-4 px-6 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700">
                        分析
                    </button>
                </nav>
            </div>

            <!-- Articles Tab -->
            <div id="articlesTab" class="tab-content p-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-semibold text-gray-900">記事管理</h3>
                    <div class="flex space-x-3">
                        <input type="text" id="articleSearchInput" placeholder="記事を検索..." class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <select id="articleStatusFilter" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                            <option value="">全ての記事</option>
                            <option value="published">公開済み</option>
                            <option value="draft">下書き</option>
                            <option value="pending">承認待ち</option>
                        </select>
                    </div>
                </div>
                <div id="articlesTable" class="overflow-x-auto">
                    <!-- Articles table will be populated by JavaScript -->
                </div>
            </div>

            <!-- Prefectures Tab -->
            <div id="prefecturesTab" class="tab-content p-6" style="display: none;">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-semibold text-gray-900">都道府県管理</h3>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="prefecturesGrid">
                    <!-- Prefectures grid will be populated by JavaScript -->
                </div>
            </div>

            <!-- Categories Tab -->
            <div id="categoriesTab" class="tab-content p-6" style="display: none;">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-semibold text-gray-900">カテゴリ管理</h3>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="categoriesGrid">
                    <!-- Categories grid will be populated by JavaScript -->
                </div>
            </div>

            <!-- Analytics Tab -->
            <div id="analyticsTab" class="tab-content p-6" style="display: none;">
                <div class="mb-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">人気記事ランキング</h3>
                    <div id="popularArticlesChart" class="bg-gray-50 rounded-lg p-4">
                        <!-- Popular articles chart will be populated by JavaScript -->
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <h4 class="text-md font-semibold text-gray-900 mb-3">都道府県別記事数</h4>
                        <div id="prefectureChart" class="bg-gray-50 rounded-lg p-4">
                            <!-- Prefecture chart will be populated by JavaScript -->
                        </div>
                    </div>
                    <div>
                        <h4 class="text-md font-semibold text-gray-900 mb-3">カテゴリ別記事数</h4>
                        <div id="categoryChart" class="bg-gray-50 rounded-lg p-4">
                            <!-- Category chart will be populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modals -->
    <!-- Edit Article Modal -->
    <div id="editArticleModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" style="display: none;">
        <div class="bg-white rounded-lg p-6 w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-gray-900">記事編集</h3>
                <button onclick="hideEditModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <form id="editArticleForm" class="space-y-4">
                <input type="hidden" id="editArticleId">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">タイトル</label>
                    <input type="text" id="editArticleTitle" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">ステータス</label>
                    <select id="editArticleStatus" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="published">公開済み</option>
                        <option value="draft">下書き</option>
                        <option value="pending">承認待ち</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">内容</label>
                    <textarea id="editArticleContent" rows="8" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" onclick="hideEditModal()" class="px-4 py-2 text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50">
                        キャンセル
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        更新
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
